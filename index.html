<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id), KEY='paleta-v3-local-1';
// ===== SERVIDOR (Supabase) =====
// Cole aqui a "Project URL" e a chave pública "anon/publishable" (Project Settings → API).
// Deixe vazio para o modo local (dados só no navegador), como na versão anterior.
const SUPABASE_URL='https://fklkuptrbemcmdtithdy.supabase.co', SUPABASE_KEY='sb_publishable_UoXElrux0uEVSzVvsFWLqQ_vjabM4iB';
const ONLINE=!!(SUPABASE_URL&&SUPABASE_KEY);
let lastRefresh=0;
const ERR={invalid_name:'Nome inválido: use de 2 a 20 caracteres, sem < ou >.',invalid_pin:'O PIN precisa ter exatamente 4 números.',name_taken:'Este nome já tem perfil. Use “Entrar” com o PIN correto.',bad_credentials:'Nome ou PIN incorretos.',locked:'Muitas tentativas erradas. Aguarde 10 minutos e tente de novo.',not_logged_in:'Sua sessão expirou. Entre novamente.',invalid_title:'Título inválido (2 a 55 caracteres, sem < ou >).',invalid_image:'Imagem inválida ou grande demais.',already_published:'Você já publicou sua obra de hoje.',already_voted:'Você já votou hoje.',publish_first:'Publique sua obra antes de votar.',invalid_artwork:'Obra inválida para voto.',network:'Sem conexão com o servidor. Tente novamente.'};
const errMsg=e=>ERR[e&&e.message]||'Não foi possível falar com o servidor. Tente de novo.';
async function api(fn,args){
 const h={'Content-Type':'application/json',apikey:SUPABASE_KEY};if(SUPABASE_KEY.startsWith('eyJ'))h.Authorization='Bearer '+SUPABASE_KEY;
 let r;try{r=await fetch(SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args||{})})}catch(e){throw new Error('network')}
 let d=null;try{d=await r.json()}catch(e){}
 const bad=!r.ok?((d&&d.message)||'server'):(d&&d.error)||null;
 if(bad){if(bad==='not_logged_in'&&state.token){state.active=null;state.token=null;save();renderNav()}throw new Error(bad)}
 return d}
// Servidor = fonte da verdade: traz galeria, vencedores e as obras do próprio artista.
async function refresh(force){
 if(!ONLINE||(!force&&Date.now()-lastRefresh<45000))return;
 try{const d=await api('paleta_snapshot',{p_token:state.token||null});
  if(state.token&&!d.me){state.active=null;state.token=null;save()}
  const byId=new Map();[...d.mine,...d.gallery].forEach(a=>byId.set(a.id,a));state.artworks=[...byId.values()];
  state.winners={};d.winners.forEach(w=>{state.winners[w.day]=w});
  state.votes=d.me&&d.me.voted?{[state.active+':'+today]:{day:today,id:null}}:{};
  lastRefresh=Date.now()}catch(e){notify(errMsg(e),true)}}
async function prepare(p){await refresh(false);
 if(p==='vote'&&user()&&ownToday()&&!state.votes[user()+':'+today]){try{state.cand=await api('paleta_candidates',{p_token:state.token})}catch(e){state.cand=[];notify(errMsg(e),true)}}}
const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const dayOffset=n=>{const [y,m,d]=today.split('-').map(Number);return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10)};
const displayDay=d=>new Date(d+'T12:00:00Z').toLocaleDateString('pt-BR',{day:'2-digit',month:'short',timeZone:'UTC'});
const clean=s=>String(s||'').replace(/[<>\u0000-\u001f]/g,'').trim();
const escapeText=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// A prévia também deve abrir quando um visualizador bloqueia localStorage.
// Nesse ambiente os dados só duram até o fechamento da aba: não simulamos persistência.
const transientStorage=new Map(),DRAFT_PREFIX='paleta-v3-draft-',hasOwn=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
let storageMode='local',draftWarned=false;
try{const probe='paleta-v4-storage-test';localStorage.setItem(probe,'1');localStorage.removeItem(probe)}catch(e){storageMode='temporary'}
function readStore(k){if(storageMode==='temporary')return transientStorage.get(k)||null;try{return localStorage.getItem(k)}catch(e){storageMode='temporary';return transientStorage.get(k)||null}}
// Rascunhos são descartáveis; perfis, obras e votos não. Quando a cota enche, sacrificamos rascunhos antes de perder dados.
function purgeDrafts(keep){try{Object.keys(localStorage).filter(x=>x.startsWith(DRAFT_PREFIX)&&x!==keep).forEach(x=>localStorage.removeItem(x))}catch(e){}}
function writeStore(k,v){
 if(storageMode==='temporary'){transientStorage.set(k,v);return true}
 try{localStorage.setItem(k,v);return true}catch(e){}
 purgeDrafts(k);try{localStorage.setItem(k,v);return true}catch(e){}
 if(k.startsWith(DRAFT_PREFIX)){if(!draftWarned){draftWarned=true;notify('Rascunho grande demais para o armazenamento do navegador: a pintura continua na tela, mas não será restaurada ao recarregar.',true)}return false}
 storageMode='temporary';transientStorage.set(k,v);notify('Seu navegador bloqueou o salvamento permanente. Os dados estão apenas nesta sessão.',true);return true}
function dropStore(k){transientStorage.delete(k);if(storageMode==='local')try{localStorage.removeItem(k)}catch(e){}}
// Rascunhos de dias anteriores nunca eram apagados e consumiam a cota do localStorage.
if(storageMode==='local')try{Object.keys(localStorage).filter(x=>x.startsWith(DRAFT_PREFIX)&&!x.endsWith('-'+today)).forEach(x=>localStorage.removeItem(x))}catch(e){}
const emptyState=()=>({users:{},artworks:[],votes:{},active:null});
function parseState(raw){try{const s=JSON.parse(raw);if(s&&typeof s.users==='object'&&s.users&&Array.isArray(s.artworks)&&typeof s.votes==='object'&&s.votes)return s}catch(e){}return null}
let state=parseState(readStore(KEY))||emptyState();
// Outra aba/janela pode ter criado perfil, publicado ou votado depois que esta página abriu: relê antes de decidir.
function syncState(){if(ONLINE)return;const s=parseState(readStore(KEY));if(!s)return;const mine=state.active;state=s;state.active=mine&&hasOwn(state.users,mine)?mine:null}
function save(){return writeStore(KEY,JSON.stringify(ONLINE?{users:state.users,artworks:[],votes:{},active:state.active,token:state.token}:state))}
let page='studio',filter='all',loginMode=Object.keys(state.users).length?'login':'register',currentTool='brush',group=2,tone=2,brushSize=15,strokes=0,canvas=null,ctx=null,paintingActive=false,last=null,undo=[],redo=[],chosen=-1,brushColor='',draftTimer=null;
const user=()=>state.active&&hasOwn(state.users,state.active)?state.active:null;
const userName=()=>user()?state.users[user()].name:'';
const ownToday=()=>state.artworks.find(x=>x.owner===user()&&x.day===today);
function notify(msg,bad=false){const el=$('toast');el.textContent=msg;el.style.color=bad?'#ffc1b6':'#a5d9c6'}
function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(16)} // Apenas identificação LOCAL, não segurança para produção.
function seeded(s){let n=parseInt(hash(s),16)>>>0;return()=>((n=(Math.imul(n,1664525)+1013904223)>>>0)/4294967296)}
function palette(day){let rnd=seeded('cores-3:'+day),hues=[],groups=[{name:'Preto',shades:['#000000']},{name:'Branco',shades:['#FFFFFF']}];for(let i=0;i<4;i++){let hue=0;for(let k=0;k<100;k++){hue=Math.floor(rnd()*360);if(hues.every(v=>Math.min(Math.abs(v-hue),360-Math.abs(v-hue))>41))break}hues.push(hue);let sat=Math.floor(57+rnd()*20);groups.push({name:'Cor '+(i+1),shades:[23,37,51,65,79].map(l=>`hsl(${hue} ${sat}% ${l}%)`)})}return groups}
const todayColors=palette(today);
const svgMarkup=(day,kind)=>{let p=palette(day),c=i=>p[i].shades[p[i].shades.length>1?2:0];let a=p[2].shades,b=p[3].shades,d=p[4].shades,e=p[5].shades;
let art=kind%5;
if(art===0)return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 305"><rect width="440" height="305" fill="${a[4]}"/><circle cx="323" cy="96" r="72" fill="${d[2]}"/><rect x="54" y="35" width="176" height="220" rx="90" fill="${b[1]}"/><path d="M0 210Q100 129 214 210T440 197V305H0" fill="${e[1]}"/><path d="M80 305L174 151 265 305" fill="none" stroke="${a[1]}" stroke-width="35"/></svg>`;
if(art===1)return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 305"><rect width="440" height="305" fill="${e[4]}"/><circle cx="329" cy="87" r="65" fill="${d[1]}"/><path d="M0 230L133 57 255 239 358 130 460 251V305H0" fill="${a[1]}"/><path d="M0 263L112 171 217 272 332 192 460 266V305H0" fill="${b[2]}"/><path d="M0 299Q170 250 300 290T440 270V305H0" fill="${e[1]}"/></svg>`;

if(ownToday()){renderStudio();return}const preview=encodeImage(canvas,.85);modal(`<div class="micro">Assinatura da obra</div><h2>Como vai se chamar?</h2><p>Esta será sua <strong>única obra do dia</strong>. Escolha o nome antes de enviar.</p><img alt="Sua pintura" src="${preview}"><label class="field-label" for="arttitle">Título da obra</label><input class="field" id="arttitle" maxlength="55" placeholder="Ex.: A cidade depois da chuva"><label class="checkline"><input id="acceptlock" type="checkbox"><span><strong>Eu entendo que esta decisão é definitiva.</strong> Depois de publicar, não poderei editar, substituir nem apagar a obra deste desafio.</span></label><p id="finalerror" class="error"></p><div class="row" style="justify-content:flex-end"><button class="btn" id="cancel">Continuar pintando</button><button class="btn btn-primary" disabled id="publish">Publicar definitivamente →</button></div>`);$('acceptlock').onchange=e=>$('publish').disabled=!e.target.checked;$('cancel').onclick=closeModal;$('arttitle').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('publish').click()}};$('publish').onclick=()=>{let title=clean($('arttitle').value).slice(0,55);if(title.length<2){$('finalerror').textContent='O título precisa de pelo menos dois caracteres.';return}syncState();if(!user()||ownToday()){closeModal();renderStudio();return}if(ONLINE){publishOnline(title,preview);return}let painting={id:'a-'+Date.now()+'-'+Math.floor(Math.random()*1000000),owner:user(),day:today,title,image:preview,created:Date.now()};state.artworks.push(painting);if(!save()){state.artworks.pop();$('finalerror').textContent='O navegador não conseguiu salvar a pintura. Não foi publicada.';return}dropStore(draftKey());resetCanvas();closeModal();renderStudio()};$('arttitle').focus()}
async function publishOnline(title,preview){
 const err=$('finalerror'),btn=$('publish');btn.disabled=true;err.textContent='';
 try{const d=await api('paleta_publish',{p_token:state.token,p_title:title,p_image:preview});state.artworks.push(d)}
 catch(e){if(e.message==='already_published'){await refresh(true);closeModal();renderStudio();return}err.textContent=errMsg(e);btn.disabled=false;return}
 dropStore(draftKey());resetCanvas();lastRefresh=0;await refresh(true);closeModal();renderStudio()}
function renderLocked(art){resetCanvas();$('content').innerHTML=heading('Obra publicada · '+displayDay(today),'Sua arte está assinada.','Sua pintura já foi enviada. A publicação é definitiva: nenhuma ferramenta de edição será oferecida depois da finalização.')+`<div class="card locked"><div><div class="micro">✓ Obra salva no acervo</div><h2 style="font:normal 35px Georgia,serif;margin:8px 0">${escapeText(art.title)}</h2><p class="muted">Por ${escapeText(state.users[art.owner]?.name||art.owner)} · ${displayDay(art.day)}</p><div class="note" style="margin:15px 0">🔒 <strong>Esta obra está bloqueada.</strong><br>Não é possível editar, substituir ou apagar a pintura após finalizar. Uma nova tela estará disponível amanhã.</div><div class="row"><button class="btn btn-primary" id="vote-now">${state.votes[user()+':'+today]?'Ver meu voto':'Votar em outras pinturas'} →</button><button class="btn" id="my-collection">Meu acervo</button><button class="btn" id="export-art">Baixar minha pintura</button></div></div><img src="${art.image}" alt="Sua obra finalizada"></div>`;$('vote-now').onclick=()=>navigate('vote');$('my-collection').onclick=()=>navigate('collection');$('export-art').onclick=()=>exportArt(art)}
function candidates(){const otherToday=ONLINE?(state.cand||[]).map(a=>({...a,day:today})):state.artworks.filter(a=>a.day===today&&a.owner!==user());const fallback=Array.from({length:6},(_,i)=>({id:'vote-demo-'+i,day:today,owner:['Maya','Luna','Caio','Rafa','Nina','Theo'][i],title:['O sonho cósmico','Formas de ontem','Manhã distante','Composição livre','Flor de inverno','Luz e sombra'][i],image:svgUrl(today,i),demo:true}));let rand=seeded('vote:'+today+':'+user());const shuffle=a=>a.map(x=>({x,r:rand()})).sort((a,b)=>a.r-b.r).map(v=>v.x);return [...shuffle(otherToday).slice(0,3),...shuffle(fallback)].slice(0,3)}
function renderVoting(){if(!user()){navigate('auth');return}if(!ownToday()){navigate('studio');return}let already=state.votes[user()+':'+today];if(already){$('content').innerHTML=heading('Votação encerrada','Seu voto foi registrado.','Você já escolheu sua obra preferida hoje. O voto não pode ser alterado.')+`<div class="note">✓ Voto concluído. O destaque da página inicial mostra o último vencedor de um dia já encerrado.</div><div class="row" style="margin-top:15px"><button class="btn btn-primary" id="go-winners">Ver vencedores →</button><button class="btn" id="go-gallery">Galeria</button></div>`;$('go-winners').onclick=()=>navigate('home');$('go-gallery').onclick=()=>navigate('gallery');return}
selectedReset();let opts=candidates();$('content').innerHTML=heading('Depois de criar, apreciar','Qual obra merece seu voto?','Escolha uma das três pinturas. A sua própria nunca concorre no seu trio. Cada artista tem apenas um voto por dia.')+`<div class="voting-grid" id="candidates">${opts.map((a,i)=>`<button data-idx="${i}" class="votecard"><img src="${a.image}" alt="${escapeText(a.title)}"><span>${escapeText(a.title)}<small>Por ${escapeText(a.owner)} · ${a.demo?'exemplo fictício':ONLINE?'artista':'artista local'}</small></span></button>`).join('')}</div><div class="row" style="justify-content:flex-end;margin:16px 0"><button class="btn btn-primary" id="record-vote" disabled>Registrar voto definitivo →</button></div><div class="note">${opts.some(a=>a.demo)?'Ainda há poucos artistas cadastrados'+(ONLINE?'':' neste navegador')+'. Algumas opções são obras fictícias de demonstração; votos nelas não contam para um ranking real.':'As obras disponíveis pertencem a outros artistas.'}</div>`;document.querySelectorAll('#candidates button').forEach(b=>b.onclick=()=>{chosen=+b.dataset.idx;document.querySelectorAll('#candidates button').forEach((x,i)=>x.classList.toggle('selected',i===chosen));$('record-vote').disabled=false});$('record-vote').onclick=()=>{let a=opts[chosen];if(!a||state.votes[user()+':'+today])return;modal(`<div class="micro">Confirme sua escolha</div><h2>Um voto por dia.</h2><p>Votar em <strong>“${escapeText(a.title)}”</strong>? Você não poderá trocar de voto depois.</p><div class="row" style="justify-content:flex-end"><button class="btn" id="vote-cancel">Cancelar</button><button class="btn btn-primary" id="vote-confirm">Confirmar voto →</button></div>`);$('vote-cancel').onclick=closeModal;$('vote-confirm').onclick=async()=>{if(ONLINE){try{await api('paleta_vote',{p_token:state.token,p_artwork:a.demo?null:a.id})}catch(e){if(e.message!=='already_voted'){closeModal();notify(errMsg(e),true);return}}state.votes[user()+':'+today]={day:today,id:a.id,demo:!!a.demo};lastRefresh=0;closeModal();renderVoting();return}syncState();if(state.votes[user()+':'+today]){closeModal();renderVoting();return}state.votes[user()+':'+today]={day:today,id:a.id,demo:!!a.demo};if(!save()){delete state.votes[user()+':'+today];return}closeModal();renderVoting()}}}
function selectedReset(){chosen=-1}
function gallerySet(){const real=publicReal(),demo=samples;return [...real,...demo].sort((a,b)=>b.day.localeCompare(a.day)||Number(b.created||0)-Number(a.created||0))}
function artCard(a){return `<button class="gallery-card" data-id="${a.id}"><img src="${a.image}" alt="${escapeText(a.title)}"><div class="caption"><strong>${escapeText(a.title)}</strong><small>Por ${escapeText(a.owner)} · ${displayDay(a.day)}</small><em>${a.demo?'Pintura ilustrativa':'Obra publicada'}</em></div></button>`}
function attachCards(list){document.querySelectorAll('.gallery-card').forEach(b=>{const a=list.find(x=>x.id===b.dataset.id);if(!a)return;b.onclick=()=>openArt(a)})}
function exportArt(a){let temp=new Image();temp.onload=()=>{const c=document.createElement('canvas');c.width=840;c.height=560;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(temp,0,0,c.width,c.height);const link=document.createElement('a');link.href=c.toDataURL('image/png');link.download='paleta-'+a.day+'-'+(a.title||'obra').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').slice(0,35)+'.png';document.body.appendChild(link);link.click();link.remove()};temp.src=a.image}
function openArt(a){let votes=a.votes!=null?a.votes:Object.values(state.votes).filter(v=>v.id===a.id).length;modal(`<div class="micro">${a.demo?'Obra ilustrativa':'Galeria do ateliê'}</div><h2>${escapeText(a.title)}</h2><img src="${a.image}" alt="Pintura de ${escapeText(a.owner)}"><p>Por <strong>${escapeText(a.owner)}</strong> · ${displayDay(a.day)} · ${a.demo?'artista fictício':votes+(ONLINE?' votos':' votos locais')}</p><div class="note">Esta pintura é uma obra concluída e não pode ser alterada.</div><div class="row" style="justify-content:flex-end;margin-top:12px">${a.owner===user()&&!a.demo?'<button id="download-art" class="btn btn-primary">Baixar PNG</button>':''}<button id="close-art" class="btn">Fechar</button></div>`);$('close-art').onclick=closeModal;if($('download-art'))$('download-art').onclick=()=>exportArt(a)}
function renderGallery(){let all=gallerySet();let works=filter==='real'?all.filter(x=>!x.demo):filter==='wins'?Array.from({length:7},(_,i)=>winnerForDay(dayOffset(-1-i))).filter(Boolean):all;$('content').innerHTML=heading('Arte compartilhada','Galeria de arte.','Explore pinturas de dias que já terminaram. As obras do desafio atual ficam fora da galeria pública até o encerramento, para preservar a votação.')+`<div class="gallery-filters"><button class="btn btn-small ${filter==='all'?'active':''}" data-filter="all">Todas</button><button class="btn btn-small ${filter==='real'?'active':''}" data-filter="real">${ONLINE?'Da comunidade':'Obras locais'}</button><button class="btn btn-small ${filter==='wins'?'active':''}" data-filter="wins">Vencedoras</button></div><div class="gallery" id="gal-items">${works.map(artCard).join('')}</div><div class="note">As pinturas marcadas como “ilustrativas” servem apenas para preencher a galeria de demonstração. Em um lançamento real, haverá apenas obras publicadas por participantes.</div>`;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderGallery()});attachCards(works);if(!works.length)$('gal-items').innerHTML='<div class="empty">Nenhuma pintura encontrada.</div>'}
function renderCollection(){if(!user()){navigate('auth');return}let own=state.artworks.filter(a=>a.owner===user()).sort((a,b)=>b.day.localeCompare(a.day));$('content').innerHTML=heading('Meu ateliê pessoal','Minhas obras.','Seu histórico de criações finalizadas. Elas ficam salvas neste navegador, ligadas ao seu nome artístico.')+`<div class="card profile-top"><div class="avatar">${escapeText((state.users[user()].name||'?')[0].toUpperCase())}</div><div><div class="micro">Artista</div><h2 style="margin:3px 0;font-size:21px">${escapeText(state.users[user()].name)}</h2><span class="muted tiny">${own.length} ${own.length===1?'obra finalizada':'obras finalizadas'}</span></div></div><div class="section-top"><h2 class="section-title">Seu acervo</h2><button class="btn btn-primary btn-small" id="collection-paint">${ownToday()?'Ver obra de hoje':'Criar obra de hoje'} →</button></div><div class="gallery" id="own-gallery">${own.map(artCard).join('')}</div>${own.length?'':'<div class="empty">Seu acervo ainda está vazio. Sua primeira pintura aparecerá aqui depois de publicada.</div>'}<div class="note">${ONLINE?'Suas obras ficam salvas na sua conta, no servidor, e aparecem em qualquer dispositivo.':'Atenção: apagar os dados do navegador também apaga os perfis e pinturas desta versão de teste. Para preservar as obras em todos os dispositivos, será necessário um servidor com contas e banco de dados.'}</div>`;$('collection-paint').onclick=()=>navigate('studio');attachCards(own)}
$('modalwrap').onclick=e=>{if(e.target===$('modalwrap'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('storage',e=>{if(e.key!==KEY)return;syncState();renderNav();if(page==='studio'&&user()&&ownToday())renderStudio()});
window.addEventListener('beforeunload',saveDraft);if(ONLINE){renderNav();$('content').innerHTML='<div class="note">Carregando…</div>';refresh(true).finally(render)}else render();if(storageMode==='temporary'&&!ONLINE)notify('Modo de teste: o navegador bloqueia o armazenamento permanente. Use o download PNG para guardar a obra.',true);
})();
</script>
